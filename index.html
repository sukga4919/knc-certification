<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K&C인증원 | 인증 컨설팅 전문기업</title>
<meta name="description" content="국내인증(KC·에너지효율·고효율·안전), 해외인증(CE·FCC·PSE·UL·CCC), 기업(확인)인증(ISO·KS·메인비즈·이노비즈·벤처·연구소·직접생산)까지 한 곳에서." />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<!-- 스타일(색상/디자인) -->
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- =====================================================================
     ★ 화면에 나오는 "글자"는 모두 content.md 에서 가져옵니다. ★
       - 내용을 바꾸려면 → content.md 를 수정하세요.
       - 색상/디자인을 바꾸려면 → style.css 를 수정하세요.
       - 이 파일(index.html)은 '뼈대'라서 손댈 일이 거의 없습니다.
     ===================================================================== -->

<!-- content.md 를 못 읽었을 때만 script.js 가 여기에 안내문을 넣습니다 -->
<div id="fileNotice"></div>

<header>
  <div class="wrap nav">
    <a href="#top" class="logo"><span class="mark" id="logoMark">KC</span><span id="logoText"></span></a>
    <ul class="menu" id="menu">
      <li><a href="#company">회사소개</a><ul class="dropdown" data-sub="company"></ul></li>
      <li><a href="#business">사업분야</a><ul class="dropdown" data-sub="business"></ul></li>
      <li><a href="#location">오시는 길</a><ul class="dropdown" data-sub="location"></ul></li>
      <li><a href="#contact">문의하기</a><ul class="dropdown" data-sub="contact"></ul></li>
    </ul>
    <a href="#contact" class="nav-cta" id="navCta">상담 문의 &nbsp;→</a>
    <button class="hamb" id="hamb" aria-label="메뉴"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero" style="padding:0">
    <div class="wrap">
      <span class="eyebrow" id="heroEyebrow"></span>
      <h1 id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="hero-btns">
        <a href="#contact" class="btn btn-primary" id="heroBtn1"></a>
        <a href="#business" class="btn btn-ghost" id="heroBtn2"></a>
      </div>
      <div class="hero-badges" id="heroBadges"></div>
    </div>
    <div class="hero-wave">
      <svg viewBox="0 0 1440 90" preserveAspectRatio="none" style="width:100%;height:70px"><path fill="#ffffff" d="M0,64L60,58.7C120,53,240,43,360,42.7C480,43,600,53,720,58.7C840,64,960,64,1080,56C1200,48,1320,32,1380,24L1440,16L1440,90L0,90Z"></path></svg>
    </div>
  </section>

  <!-- COMPANY -->
  <section id="company">
    <div class="wrap company-grid">
      <div class="company-text reveal">
        <span class="eyebrow" id="companyEyebrow"></span>
        <h2 class="sec-title" id="companyTitle"></h2>
        <p id="companyBody"></p>
        <div class="hero-btns" style="margin-top:28px">
          <a href="#business" class="btn btn-primary" style="background:var(--brand);color:#fff">사업분야 자세히 보기 &nbsp;→</a>
        </div>
      </div>
      <div class="company-visual reveal">
        <div class="ribbon" style="top:20px;left:22px">CERTIFICATION</div>
        <div class="ribbon" style="bottom:20px;right:22px">TOTAL SOLUTION</div>
        <div class="seal"><span><b id="sealMark">K&C</b><small id="sealText">인증원</small></span></div>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <section class="stats" id="stats" style="padding:64px 0">
    <div class="wrap"><div class="stats-grid" id="statsGrid"></div></div>
  </section>

  <!-- BUSINESS -->
  <section id="business">
    <div class="wrap center">
      <span class="eyebrow" id="bizEyebrow"></span>
      <h2 class="sec-title" id="bizTitle"></h2>
      <p class="sec-desc" id="bizDesc" style="max-width:660px;margin-left:auto;margin-right:auto"></p>
    </div>
    <div class="wrap" id="bizGroups"></div>
  </section>

  <!-- LOCATION -->
  <section class="loc" id="location">
    <div class="wrap center">
      <span class="eyebrow" id="locEyebrow"></span>
      <h2 class="sec-title" id="locTitle"></h2>
    </div>
    <div class="wrap loc-grid">
      <div class="map-box reveal"><iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="오시는 길 지도"></iframe></div>
      <div class="loc-info reveal" id="locInfo"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="contact-sec" id="contact">
    <div class="wrap">
      <div class="contact-grid">
        <div class="contact-left reveal">
          <span class="eyebrow" id="ctEyebrow"></span>
          <h2 class="sec-title" id="ctTitle"></h2>
          <p class="sec-desc" id="ctDesc"></p>
          <ul id="ctInfo"></ul>
        </div>
        <div class="form reveal">
          <h3>무료 상담 신청</h3>
          <p class="sub">필요한 인증 분야와 제품을 알려주세요.</p>
          <form id="inquiryForm">
            <div class="row2">
              <div class="field"><label>이름 / 회사명 <span>*</span></label><input name="name" required placeholder="홍길동 / (주)OOO" /></div>
              <div class="field"><label>연락처 <span>*</span></label><input name="phone" required placeholder="010-0000-0000" /></div>
            </div>
            <div class="field"><label>이메일</label><input type="email" name="email" placeholder="name@example.com" /></div>
            <div class="field"><label>관심 인증 분야</label><select name="service" id="serviceSelect"><option value="">선택해 주세요</option></select></div>
            <div class="field"><label>문의 내용 <span>*</span></label><textarea name="message" required placeholder="제품/업종과 필요한 인증, 일정 등을 적어주세요."></textarea></div>
            <button type="submit" class="form-submit">문의 보내기</button>
            <p class="form-note" id="formNote"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div>
        <div class="foot-brand"><span class="mark" id="footMark">KC</span><span id="footBrand"></span></div>
        <p class="foot-msg" id="footMsg"></p>
      </div>
      <div class="foot-contact" id="footContact"></div>
    </div>
    <div class="foot-bottom" id="footCopy"></div>
  </div>
</footer>

<button class="to-top" id="toTop" aria-label="위로">↑</button>

<!-- 동작 스크립트 (content.md 를 읽어 위 뼈대에 글자를 채웁니다) -->
<script src="script.js"></script>
</body>
</html>
