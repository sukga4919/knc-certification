<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K&C인증원 | 인증 컨설팅 전문기업</title>
<meta name="description" content="국내인증(KC·에너지효율·고효율·안전), 해외인증(CE·FCC·PSE·UL·CCC), 기업(확인)인증(ISO·KS·메인비즈·이노비즈·벤처·연구소·직접생산)까지 한 곳에서." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
/* =========================================================
   ★ 색상만 바꾸고 싶다면 아래 값만 바꾸세요 ★
   ========================================================= */
:root{
  --brand:#0b3a6f;        /* 메인 남색 */
  --brand-2:#1769c0;      /* 포인트 파랑 */
  --brand-3:#0aa5b1;      /* 보조 청록 */
  --ink:#141b26;          /* 진한 글자색 */
  --muted:#5c6a7a;        /* 흐린 글자색 */
  --line:#e6ebf1;         /* 경계선 */
  --bg:#ffffff;
  --bg-soft:#f4f7fb;      /* 옅은 배경 */
  --radius:16px;
  --shadow:0 10px 30px rgba(11,58,111,.08);
  --shadow-lg:0 24px 60px rgba(11,58,111,.16);
  --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.65;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.eyebrow{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--brand-2);margin-bottom:14px}
.sec-title{font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.25;letter-spacing:-.02em}
.sec-desc{color:var(--muted);margin-top:14px;font-size:17px}
section{padding:96px 0}
.center{text-align:center}

/* ================= HEADER ================= */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:var(--brand)}
.logo .mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:15px;font-weight:800}
.menu{display:flex;gap:6px;align-items:center}
.menu>li{position:relative;list-style:none}
.menu>li>a{display:block;padding:12px 16px;font-weight:600;font-size:16px;border-radius:10px;color:var(--ink)}
.menu>li:hover>a{background:var(--bg-soft);color:var(--brand)}
.dropdown{position:absolute;top:100%;left:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.18s ease;list-style:none}
.menu>li:hover .dropdown{opacity:1;visibility:visible;transform:translateY(4px)}
.dropdown li a{display:block;padding:10px 14px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:500}
.dropdown li a:hover{background:var(--bg-soft);color:var(--brand-2)}
.nav-cta{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;font-size:15px;transition:.2s}
.nav-cta:hover{background:var(--brand-2);transform:translateY(-1px)}
.hamb{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:8px}
.hamb span{width:24px;height:2px;background:var(--ink);border-radius:2px;transition:.2s}

/* ================= HERO ================= */
.hero{position:relative;color:#fff;overflow:hidden;background:radial-gradient(1200px 500px at 80% -10%,rgba(10,165,177,.35),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(23,105,192,.45),transparent 55%),linear-gradient(135deg,#08284c 0%,#0b3a6f 55%,#124a8a 100%)}
.hero .wrap{padding-top:104px;padding-bottom:112px;position:relative;z-index:2}
.hero .eyebrow{color:#8fd4ff}
.hero h1{font-size:clamp(32px,5.2vw,58px);font-weight:800;line-height:1.18;letter-spacing:-.025em}
.hero p{margin-top:22px;font-size:clamp(16px,2vw,19px);color:#d7e6f6;max-width:640px}
.hero-btns{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:15px 30px;border-radius:999px;font-weight:700;font-size:16px;transition:.2s;cursor:pointer;border:0}
.btn-primary{background:#fff;color:var(--brand)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.25)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.hero-badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:44px}
.hero-badges span{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#eaf3fc}
.hero-wave{position:absolute;bottom:-1px;left:0;width:100%;z-index:1;line-height:0}

/* ================= COMPANY ================= */
.company-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.company-text .sec-title{margin-top:6px}
.company-text p{color:var(--muted);margin-top:20px;font-size:17px}
.company-visual{border-radius:24px;min-height:340px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:var(--shadow-lg);display:grid;place-items:center;color:#fff;padding:30px}
.company-visual .seal{width:150px;height:150px;border-radius:50%;border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;text-align:center;font-weight:800;background:rgba(255,255,255,.08)}
.company-visual .seal b{display:block;font-size:30px;letter-spacing:.05em}
.company-visual .seal small{font-size:12px;letter-spacing:.15em;opacity:.85;font-weight:600}
.ribbon{position:absolute;font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.7)}

/* ================= STATS ================= */
.stats{background:var(--bg-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;box-shadow:var(--shadow)}
.stat .num{font-size:clamp(30px,4vw,46px);font-weight:800;color:var(--brand);letter-spacing:-.02em}
.stat .num .suf{color:var(--brand-3)}
.stat .lab{margin-top:8px;color:var(--muted);font-weight:600;font-size:15px}

/* ================= BUSINESS (그룹형) ================= */
.biz-group{margin-top:64px}
.biz-group:first-child{margin-top:52px}
.biz-group-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:30px}
.biz-group-eng{font-size:12.5px;font-weight:800;letter-spacing:.18em;color:var(--brand-2)}
.biz-group-name{font-size:clamp(20px,2.6vw,26px);font-weight:800;margin-top:6px;position:relative;padding-left:16px}
.biz-group-name::before{content:"";position:absolute;left:0;top:6px;bottom:4px;width:5px;border-radius:3px;background:linear-gradient(var(--brand),var(--brand-3))}
.biz-group-desc{color:var(--muted);font-size:15px;max-width:420px;text-align:right}
.biz-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:20px}
.biz-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 18px 24px;text-align:center;transition:.22s;position:relative;overflow:hidden}
.biz-item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand-3));transform:scaleX(0);transition:.25s}
.biz-item:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent}
.biz-item:hover::after{transform:scaleX(1)}
.biz-item .mark{height:66px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.biz-item .mark svg{max-height:58px;max-width:132px;width:auto;height:auto}
.biz-item .mark img{max-height:60px;max-width:150px;width:auto;height:auto;object-fit:contain}
.biz-item h4{font-size:16px;font-weight:800;word-break:keep-all;line-height:1.35}
.biz-item p{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.55;word-break:keep-all}

/* ================= LOCATION ================= */
.loc{background:var(--bg-soft)}
.loc-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;margin-top:52px}
.map-box{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);min-height:380px;background:#dfe7ef}
.map-box iframe{width:100%;height:100%;min-height:380px;border:0;display:block}
.loc-info{display:flex;flex-direction:column;gap:16px}
.loc-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;gap:16px;align-items:flex-start}
.loc-item .ic{flex:0 0 44px;height:44px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.loc-item .ic svg{width:22px;height:22px}
.loc-item h4{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.loc-item p{font-weight:600;margin-top:3px;font-size:16px;word-break:keep-all}
.loc-item a{color:var(--brand-2)}

/* ================= CONTACT ================= */
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center;margin-top:44px}
.contact-left .sec-title{color:#fff}
.contact-left .sec-desc{color:#cfe0f2}
.contact-left .eyebrow{color:#8fd4ff}
.contact-left ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:14px}
.contact-left li{display:flex;gap:12px;align-items:center;color:#eaf3fc;font-weight:600}
.contact-left li svg{width:20px;height:20px;color:#8fd4ff;flex:0 0 auto}
.form{background:#fff;border-radius:20px;padding:34px;box-shadow:var(--shadow-lg)}
.form h3{font-size:20px;font-weight:800;margin-bottom:6px}
.form .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.field label span{color:#e0483b}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:#fbfcfe;transition:.15s;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 4px rgba(23,105,192,.1)}
.field textarea{resize:vertical;min-height:110px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-submit{width:100%;background:var(--brand);color:#fff;padding:15px;border:0;border-radius:11px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.form-submit:hover{background:var(--brand-2)}
.form-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}
.contact-sec{background:radial-gradient(900px 400px at 90% 0%,rgba(10,165,177,.3),transparent 60%),linear-gradient(135deg,#08284c,#0b3a6f 60%,#124a8a)}

/* ================= FOOTER ================= */
footer{background:#0a1a2f;color:#aebfd2;padding:56px 0 32px}
.foot-top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start}
.foot-brand{font-weight:800;font-size:20px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.foot-brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-2),var(--brand-3));color:#fff;font-size:13px}
.foot-msg{max-width:440px;font-size:15px;color:#9fb2c8}
.foot-contact{font-size:14px;line-height:2}
.foot-contact b{color:#dfe9f5}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:34px;padding-top:22px;font-size:13px;color:#7c90a8}

.to-top{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:90;cursor:pointer;border:0}
.to-top.show{opacity:1;pointer-events:auto}
.reveal{opacity:0;transform:translateY(24px);transition:.6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:960px){
  .company-grid,.loc-grid,.contact-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  section{padding:72px 0}
}
@media(max-width:720px){
  .hamb{display:flex}
  .menu{position:fixed;top:74px;right:0;height:calc(100vh - 74px);width:min(320px,86vw);background:#fff;flex-direction:column;align-items:stretch;gap:0;padding:14px;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:.28s;overflow-y:auto}
  .menu.open{transform:none}
  .menu>li>a{padding:14px 12px;border-bottom:1px solid var(--line)}
  .dropdown{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;padding:0 0 8px 10px;min-width:0}
  .menu>li:hover .dropdown{transform:none}
  .nav-cta{display:none}
  .biz-group-head{flex-direction:column;align-items:flex-start;gap:8px}
  .biz-group-desc{text-align:left}
  .biz-items{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:460px){ .biz-items{grid-template-columns:1fr} }
</style>
</head>
<body>

<script type="text/plain" id="content-source">
# ===== 기본 정보 (로고/회사명) =====
회사명: K&C인증원
영문사명: K&C Certification Office
로고글자: K&C인증원

# ===== 첫 화면 (히어로) =====
히어로_소제목: CERTIFICATION TOTAL SOLUTION
히어로_제목: 인증의 시작부터 완료까지,\n하나로 끝내는 파트너
히어로_설명: 국내·해외 인증부터 ISO·기업인증까지, 복잡한 인증 절차를 한 곳에서 해결해 드립니다.\nK&C인증원이 여러분의 든든한 인증 파트너가 되겠습니다.
히어로_버튼1: 무료 상담 문의
히어로_버튼2: 사업분야 보기

# ===== 회사소개 =====
회사소개_소제목: COMPANY
회사소개_제목: 인증 컨설팅 전문기업\nK&C인증원입니다
회사소개_본문: 저희는 국내인증(KC·에너지효율·고효율·안전), 해외인증(CE·FCC·PSE·UL·CCC), 기업(확인)인증(ISO·KS·메인비즈·이노비즈·벤처·연구소·직접생산)까지 아우르는 인증 컨설팅 전문기업입니다. 축적된 경험과 시험·인증기관 네트워크를 바탕으로, 고객의 시간과 비용을 줄이고 한 번에 인증을 취득할 수 있도록 함께합니다.
숫자1_값: 13
숫자1_접미사: 년
숫자1_라벨: 인증 컨설팅 경력
숫자2_값: 16
숫자2_접미사: 개
숫자2_라벨: 인증 서비스 항목
숫자3_값: 1500
숫자3_접미사: +
숫자3_라벨: 누적 인증 실적
숫자4_값: 98
숫자4_접미사: %
숫자4_라벨: 고객 만족도

# ===== 사업분야 =====
# 사업분야는 3개 그룹으로 구성됩니다.
#  1) [사업분야그룹] 에 그룹을 "이름 | 영문 | 설명" 형식으로 적습니다.
#  2) 각 그룹 이름과 똑같은 [이름] 블록에 인증 항목을 넣습니다.
#     항목 형식 →  마크ID | 인증이름 | 설명
#     (마크ID는 로고 그림을 고르는 코드입니다. 사용 가능한 코드:
#      KC, ENERGY, HIGHEFF, SAFETY, CE, FCC, PSE, UL, CCC,
#      ISO, KS, MAINBIZ, INNOBIZ, VENTURE, RND, DIRECT)
사업분야_소제목: BUSINESS
사업분야_제목: 사업 분야
사업분야_설명: 국내·해외 인증부터 기업(확인)인증까지, 분야별로 필요한 인증을 한 곳에서 지원합니다.

[사업분야그룹]
국내인증 | DOMESTIC | 국내 판매·유통에 필요한 필수 인증
해외인증 | OVERSEAS | 해외 수출을 위한 국가별 강제·필수 인증
기업(확인)인증 | ENTERPRISE | 기업 경쟁력과 정책 혜택을 높이는 인증·확인 제도

[국내인증]
KC | 국내 KC인증 | 전기·전자·생활용품 등 KC 안전인증과 전자파(EMC) 대응
ENERGY | 에너지효율등급 | 에너지소비효율 등급표시 대상 제품 신고·시험 대행
HIGHEFF | 고효율에너지기자재 인증 | 고효율기자재 인증 대상 품목 시험·신청 지원
SAFETY | 안전인증 및 안전확인 (공급자적합성확인) | 안전인증·안전확인·자율안전확인 전 과정 대응

[해외인증]
CE | CE · 유럽 | 유럽 수출을 위한 CE 마킹 적합성 평가
FCC | FCC · 미국 | 미국 전자파 적합성 FCC 인증
PSE | PSE · 일본 | 일본 전기용품 안전 PSE 인증
UL | UL · 북미 | 북미 시장 진입을 위한 UL 안전 인증
CCC | CCC · 중국 | 중국 강제인증제도 CCC 취득

[기업(확인)인증]
ISO | ISO 9001·14001·45001 | 품질·환경·안전보건 경영시스템 인증
KS | KS인증 컨설팅 | 한국산업표준(KS) 인증 취득 컨설팅
MAINBIZ | 메인비즈 인증 | 경영혁신형 중소기업(MainBiz) 확인

/* ===================================================================
   content 파싱 (일반 항목 / 사업분야 그룹·항목 / 메뉴 하위목록)
   =================================================================== */
const RAW=document.getElementById('content-source').textContent;
function parseContent(raw){
  const data={}, lists={}, groups=[], items={};
  const groupNames=new Set();
  let mode='kv', curList=null, curGroup=null;
  for(const line of raw.split(/\r?\n/)){
    const t=line.trim();
    if(!t||t.startsWith('#')) continue;
    const m=t.match(/^\[(.+)\]$/);
    if(m){
      const name=m[1].trim();
      if(name==='사업분야그룹'){mode='groups';continue;}
      if(groupNames.has(name)){mode='items';curGroup=name;items[name]=items[name]||[];continue;}
      mode='list';curList=name;lists[name]=[];continue;
    }
    if(mode==='groups'){
      if(t.includes('|')){
        const p=t.split('|').map(s=>s.trim());
        const g={name:p[0]||'',eng:p[1]||'',desc:p[2]||''};
        groups.push(g);groupNames.add(g.name);items[g.name]=[];
        continue;
      }
      mode='kv';           /* '|' 없는 줄 → 그룹 목록 끝 */
    }
    if(mode==='items'){
      if(t.includes('|')){
        const p=t.split('|').map(s=>s.trim());
        items[curGroup].push({mark:p[0]||'',title:p[1]||'',desc:p[2]||''});
        continue;
      }
      mode='kv';           /* '|' 없는 줄 → 항목 목록 끝 */
    }
    if(mode==='list'){
      const i=t.indexOf(':');
      if(i>-1){ lists[curList].push({name:t.slice(0,i).trim(),href:t.slice(i+1).trim()}); continue; }
      mode='kv';
    }
    const i=t.indexOf(':');
    if(i>-1) data[t.slice(0,i).trim()]=t.slice(i+1).trim();
  }
  return {data,lists,groups,items};
}
const nl=s=>(s||'').replace(/\\n/g,'<br>');
const {data,lists,groups,items}=parseContent(RAW);
const allItems=groups.flatMap(g=>items[g.name]||[]);

/* ===================================================================
   인증 마크(로고)
   ★ 실제 공식 로고를 넣는 방법 ★
     index.html 과 같은 폴더에 "marks" 폴더를 만들고, 그 안에
     아래 파일명으로 실제 로고 이미지를 저장하면 자동으로 표시됩니다.

       marks/ccc.png      marks/iso.png      marks/ks.png       marks/mainbiz.png
       marks/innobiz.png  marks/venture.png  marks/rnd.png      marks/direct.png
     (png 대신 jpg/svg를 쓰려면 확장자에 맞게 파일명만 바꿔 넣으세요.)
   아래 SVG는 실제 로고 파일이 아직 없을 때만 임시로 보여주는 대체 그림입니다.

 ISO:`<svg width="128" height="66" viewBox="0 0 128 66"><circle cx="33" cy="33" r="29" fill="#0b3a6f"/><text x="33" y="40" text-anchor="middle" font-family="Arial" font-weight="800" font-size="19" fill="#fff">ISO</text><text x="70" y="26" font-family="Arial" font-weight="800" font-size="13" fill="#0b3a6f">9001</text><text x="70" y="41" font-family="Arial" font-weight="800" font-size="13" fill="#1769c0">14001</text><text x="70" y="56" font-family="Arial" font-weight="800" font-size="13" fill="#0aa5b1">45001</text></svg>`,
 KS:`<svg width="100" height="60" viewBox="0 0 100 60"><text x="50" y="45" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="44" fill="#0b3a6f" letter-spacing="-1">KS</text></svg>`,
 MAINBIZ:`<svg width="150" height="52" viewBox="0 0 150 52"><text x="6" y="36" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="29" fill="#003a70">Main</text><text x="80" y="36" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="29" fill="#e2001a">biz</text></svg>`,
 INNOBIZ:`<svg width="164" height="52" viewBox="0 0 164 52"><text x="6" y="36" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="27" fill="#0067b3">INNO</text><text x="92" y="36" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="27" fill="#39a935">-BIZ</text></svg>`,
 VENTURE:`<svg width="120" height="62" viewBox="0 0 120 62"><rect x="3" y="9" width="114" height="44" rx="22" fill="#fff" stroke="#e2001a" stroke-width="3"/><text x="60" y="30" text-anchor="middle" font-family="Arial" font-weight="800" font-size="13" letter-spacing="1" fill="#e2001a">VENTURE</text><text x="60" y="46" text-anchor="middle" font-family="'Malgun Gothic',sans-serif" font-weight="800" font-size="12" fill="#333">벤처기업 확인</text></svg>`,
 RND:`<svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="32" fill="#0e6b8f"/><path d="M29 16h12v3h-2v9l8 15a4 4 0 0 1-3.6 5.8H26.6A4 4 0 0 1 23 43l8-15v-9h-2z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><circle cx="35" cy="42" r="3" fill="#8fe3ff"/><text x="35" y="61" text-anchor="middle" font-family="'Malgun Gothic',sans-serif" font-weight="800" font-size="9" fill="#eaf7ff">연구소</text></svg>`,

const markSVG=id=>MARKS[id]||MARKS.DEFAULT;

/* ---- 기본 정보 ---- */

const initials=(data['영문사명']||'KC').replace(/[^A-Za-z& ]/g,'').split(/\s|&/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'KC';

document.getElementById('logoText').textContent=data['로고글자']||data['회사명'];

document.getElementById('heroBtn2').textContent=data['히어로_버튼2']||'사업분야 보기';
const badgeMarks=['KC','ENERGY','CE','FCC','PSE','UL','CCC','ISO','KS'];
document.getElementById('heroBadges').innerHTML=allItems.filter(it=>badgeMarks.includes(it.mark)).map(it=>'<span>'+it.title.split(/[·(]/)[0].trim()+'</span>').join('');

/* ---- 통계 ---- */
document.getElementById('statsGrid').innerHTML=[1,2,3,4].map(i=>{
  const v=data['숫자'+i+'_값']; if(v===undefined) return '';
  return '<div class="stat reveal"><div class="num"><span class="count" data-target="'+v+'">0</span><span class="suf">'+(data['숫자'+i+'_접미사']||'')+'</span></div><div class="lab">'+(data['숫자'+i+'_라벨']||'')+'</div></div>';
}).join('');

/* ---- 사업분야 (그룹 + 마크) ---- */
document.getElementById('bizEyebrow').textContent=data['사업분야_소제목'];
document.getElementById('bizTitle').textContent=data['사업분야_제목'];
document.getElementById('bizDesc').textContent=data['사업분야_설명'];
document.getElementById('bizGroups').innerHTML=groups.map((g,gi)=>{
  const its=items[g.name]||[];
  return '<div class="biz-group reveal" id="biz-g'+gi+'">'+
    '<div class="biz-group-head"><div><span class="biz-group-eng">'+(g.eng||'')+'</span>'+
    '<h3 class="biz-group-name">'+g.name+'</h3></div>'+
    (g.desc?'<p class="biz-group-desc">'+g.desc+'</p>':'')+'</div>'+
    '<div class="biz-items">'+its.map(it=>
      '<div class="biz-item"><div class="mark" data-mark="'+it.mark+'">'+
        '<img src="marks/'+it.mark.toLowerCase()+'.png" alt="'+it.title+' 인증 마크" onerror="markFallback(this)">'+
      '</div><h4>'+it.title+'</h4>'+(it.desc?'<p>'+it.desc+'</p>':'')+'</div>'
    ).join('')+'</div></div>';
}).join('');
/* marks 폴더에 실제 로고 파일(kc.png, ce.png ...)이 없으면 임시 그림으로 자동 대체 */
window.markFallback=function(img){
  img.onerror=null;
  const d=img.parentNode;
  d.innerHTML=markSVG(d.getAttribute('data-mark'));
};
document.querySelectorAll('#bizGroups .mark[data-mark] img').forEach(img=>{

   인터랙션
   =================================================================== */
const menu=document.getElementById('menu'), hamb=document.getElementById('hamb');
hamb.addEventListener('click',()=>menu.classList.toggle('open'));
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>menu.classList.remove('open')));

function animateCount(el){
  const target=parseFloat(el.dataset.target)||0, dur=1400, start=performance.now();
  (function step(now){
    const p=Math.min((now-start)/dur,1), eased=1-Math.pow(1-p,3);
    el.textContent=Math.floor(eased*target).toLocaleString();
    if(p<1)requestAnimationFrame(step); else el.textContent=target.toLocaleString();
  })(start);
}
const io=new IntersectionObserver((es)=>{
  es.forEach(en=>{
    if(en.isIntersecting){
      en.target.classList.add('in');
      en.target.querySelectorAll('.count').forEach(c=>{if(!c.dataset.done){c.dataset.done=1;animateCount(c);}});
      io.unobserve(en.target);
    }
  });
},{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

const toTop=document.getElementById('toTop');
addEventListener('scroll',()=>toTop.classList.toggle('show',scrollY>500));
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
